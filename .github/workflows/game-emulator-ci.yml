name: GAME Emulator CI

on:
  push:
    paths:
      - "GAME-Emulator/**"
      - ".github/workflows/game-emulator-ci.yml"
  pull_request:
    paths:
      - "GAME-Emulator/**"
      - ".github/workflows/game-emulator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GAME-Emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GAME-Emulator/pyproject.toml
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
