name: GAME Emulator CI

on:
  # Run for every change so required checks cannot remain pending due to
  # path filters. The project is small and security-sensitive; full CI is cheap.
  push:
  pull_request:
  # Required when the repository uses GitHub's merge queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-emulator-ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test with explicit skip reasons
        run: pytest -q -rs
